CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_TIME_SYNC=y
CONFIG_OPENTHREAD_ENABLE_SERVICE=y
CONFIG_JSON_LIBRARY=y

# Logging

# CONFIG_LOG=y
# CONFIG_LOG_MAX_LEVEL=4
# CONFIG_LOG_MODE_MINIMAL=y
# CONFIG_BOOT_BANNER=y
# CONFIG_LOG_BACKEND_UART=y

CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_BOOT_BANNER=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# Kernel options
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=16384
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=8192
CONFIG_INIT_STACKS=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Add features required for FTD CLI
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_PING_SENDER=y

# Network config
CONFIG_OPENTHREAD_PANID=4660
CONFIG_OPENTHREAD_XPANID="11:11:11:11:22:22:22:22"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_NETWORK_NAME="Fog"

# Flash and persistence
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_GLIBCXX_LIBCPP=y

# PSA key generation
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y     # export the public half for provisioning
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y          # import peers' public keys for verification

# PSA crypto backend
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_CCM=y

CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y

CONFIG_HW_UNIQUE_KEY=y
CONFIG_HW_UNIQUE_KEY_RANDOM=y
CONFIG_HW_UNIQUE_KEY_LOAD=y
# CONFIG_NRF_SECURITY=y

CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y

CONFIG_BUILD_WITH_TFM=y

CONFIG_SECURE_BOOT=n
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

CONFIG_HWINFO=y
