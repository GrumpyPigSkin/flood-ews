CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_TIME_SYNC=y
CONFIG_JSON_LIBRARY=y

# Logging
CONFIG_LOG=y
# (optional)
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y

# Kernel options
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_INIT_STACKS=y

# SSED / CSL Activation
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_CSL_RECEIVER=y
CONFIG_OPENTHREAD_CSL_RECEIVER_LOCAL_TIME_SYNC=y
CONFIG_OPENTHREAD_CSL_AUTO_SYNC=y
CONFIG_OPENTHREAD_CSL_TIMEOUT=100
CONFIG_OPENTHREAD_MANUAL_START=y

# Network config
CONFIG_OPENTHREAD_PANID=4660
CONFIG_OPENTHREAD_XPANID="11:11:11:11:22:22:22:22"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_NETWORK_NAME="JSN-SR04 Sensor"

# Flash and persistence
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Config for C++
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_GLIBCXX_LIBCPP=y

# MBEDTLS stuff
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Enable PSA features for keys.
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

CONFIG_TRUSTED_STORAGE=y
CONFIG_BUILD_WITH_TFM=y
